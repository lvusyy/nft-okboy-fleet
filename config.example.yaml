# nft-okboy — nftables dynamic firewall allowlist manager (server config)
# Copy to config.yaml and edit. nft-okboy reads the file given with -c/--config,
# else a config.yaml next to the executable if there is one, else
# /etc/nft-okboy/config.yaml.

# The server listens here. With nginx on the same host, bind localhost only; a
# hub reached from other hosts (e.g. through a Kubernetes Service) needs a
# reachable address such as 0.0.0.0.
listen_host: 127.0.0.1
listen_port: 5000

# Not used (ignored). Each group sets its own protocol: --proto on group-add and
# group-target add, or "proto" in the HTTP API; tcp by default.
proto: tcp

# Optional port whitelist, enforced by the HTTP API only: groups created through
# the API (and so the web console) may only use these ports. The CLI (group-add,
# group-target add) does not check it. Omit = no limit.
# allowed_ports: [22, 80, 443, 8080]

# ---- Security ----
signature_ttl: 300            # HMAC timestamp window, seconds
rule_prefix: nft-okboy            # rule comment = <prefix>:<user>:<group> (nft & ufw)

# X-Real-IP / X-Forwarded-For are trusted ONLY when the direct peer is in this
# list (your reverse proxy). A direct client cannot then spoof its registered IP.
# Exact IP addresses only; CIDR ranges are not supported.
trusted_proxies: ["127.0.0.1", "::1"]

# Per-IP abuse throttle: after N failed auths from one IP within the window,
# further /api/* requests from that IP get HTTP 429. Keyed on IP, not username
# (so an attacker can't lock out a legitimate user). 0 disables. The same limit
# also caps wrong TOTP codes per admin account, counted from any IP.
throttle_max_failures: 10
throttle_window: 300

# Admin TOTP step-up. An admin who has enrolled TOTP must send a current code
# with every admin write, whatever this is set to. true additionally blocks
# admins who have NOT enrolled from those writes until they enroll (enrolling
# itself stays allowed).
require_admin_totp: false

# Reject replay of an already-consumed TOTP step-up code (RFC 6238 §5.2).
totp_replay_protection: true

# ---- Anomaly detection (possible credential sharing) ----
# A knock response carries a warning once a user's IP has changed at least
# anomaly_max_changes times within anomaly_window seconds.
anomaly_window: 3600
anomaly_max_changes: 5

# ---- Firewall backend ----
# Which firewall to drive: "nftables" (default), "ufw", or "none".
#   nftables — a dedicated inet table (configured below). The default.
#   ufw      — drive the host's ufw via the `ufw` CLI (Debian/Ubuntu, nf_tables).
#              When migrating an existing ufw-okboy (Python) host, also set
#              rule_prefix: ufw-okboy so its existing ufw rules are recognized.
#   none     — control-plane-only hub: manage NO local firewall (edge agents
#              enforce). Use on a dedicated hub that only serves desired state.
firewall_backend: nftables

# Agent-side guard (edge nodes only): the agent opens ONLY these ports, refusing
# any rule the hub pushes on another port — defense in depth if the hub is
# compromised (a hostile hub still cannot tell this node to open, say, 22).
# With the nftables backend it is also the set of ports the agent may CLOSE to
# non-allowlisted sources: a port not listed here is never guarded (the agent
# logs a warning), so a hostile hub cannot close, say, 22 fleet-wide either.
# Empty / omitted = no restriction on opening, and no guard. No effect on the hub.
# CLI override: --allow-ports
# agent_allowed_ports: [18080, 443]

# ---- nftables backend (used when firewall_backend: nftables) ----
# A dedicated `inet <nft_table>` table with one input chain at the given hook
# priority: an accept rule per allowlisted IP, then a guard that drops new
# connections (for UDP: every datagram) to each managed port from everyone else.
# Managed ports = the groups' ports (server) or the node's group targets that are
# listed in agent_allowed_ports (agent). Other ports are never touched, so the table
# coexists with the host / k8s firewall in their own tables. But an accept here is
# not final: if another firewall on the host (ufw, firewalld, nftables.conf) drops a
# managed port, allowlisted clients stay blocked — open the port there (the guard
# then does the restricting), or on a ufw host use firewall_backend: ufw. Ports that
# Docker (-p) or Kubernetes (NodePort) DNAT elsewhere never reach the input hook:
# nft-okboy neither guards nor allowlists them. The server/agent logs the other
# firewalls and nat chains it finds at startup.
nft_table: nft_okboy
nft_chain: input
# 0 is treated as unset and replaced by -150.
nft_priority: -150
# false removes the guard: the table then only adds accept rules, which restrict
# nothing (ports stay open to everyone). Only for a transition.
nft_guard: true

# ---- Expiry ----
# A user who has not knocked for this many days loses their allowlist entry, here
# and on every node (checked hourly; they are back on their next knock). 0 = never.
cleanup_max_age_days: 7

# ---- Storage ----
db_path: /var/lib/nft-okboy/nft-okboy.db
backup_dir: /var/lib/nft-okboy/backups
backup_keep: 7

# ---- First-run user seed (optional) ----
# Imported only when the database file is created: the first command that opens
# a new db_path (serve or any CLI command) creates these users once, as
# NON-admins (grant admin with `nft-okboy admin-add <user>`). An existing
# database is never seeded, even one without users. Secrets shorter than 32
# characters are skipped. Generate a secret with:
#   nft-okboy gen-secret alice
# users:
#   admin:
#     secret: "<64 hex chars>"
